<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --ok: #2fa36b; --bad: #e5484d; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 11px/1.45 Inter, system-ui, sans-serif; color: var(--figma-color-text, #222); background: var(--figma-color-bg, #fff); user-select: none; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
  .muted { color: var(--figma-color-text-secondary, #777); }
  section { padding: 12px 14px; border-bottom: 1px solid var(--figma-color-border, #e5e5e5); }
  header { display: flex; align-items: center; gap: 10px; padding: 14px; border-bottom: 1px solid var(--figma-color-border, #e5e5e5); }
  header svg { flex: none; }
  .title { font-size: 12px; font-weight: 600; line-height: 1.2; }
  .ver { margin-left: auto; font-size: 10px; }
  .state { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; margin-bottom: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--bad); }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  dl { display: grid; grid-template-columns: 62px 1fr; row-gap: 3px; margin: 0; }
  dt { color: var(--figma-color-text-secondary, #777); }
  dd { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .help { margin-top: 10px; padding: 8px 10px; border-radius: 6px; background: var(--figma-color-bg-secondary, #f5f5f5); line-height: 1.5; }
  .help code { display: block; margin-top: 4px; word-break: break-all; user-select: text; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); }
  .stats div { padding: 10px 14px; }
  .stats div + div { border-left: 1px solid var(--figma-color-border, #e5e5e5); }
  .stats b { display: block; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .stats span { color: var(--figma-color-text-secondary, #777); font-size: 10px; }
  .stats-wrap { padding: 0; }
  h2 { margin: 0 0 6px; font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--figma-color-text-secondary, #777); }
  #log { height: 128px; overflow-y: auto; margin: 0 -14px; padding: 0 14px; }
  .row { display: grid; grid-template-columns: 52px 1fr 40px; gap: 8px; padding: 2px 0; align-items: baseline; }
  .row .m { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .ms { text-align: right; font-variant-numeric: tabular-nums; }
  .row.err .m { color: var(--bad); }
  .empty { padding: 28px 0; text-align: center; }
  details { padding: 10px 14px; }
  summary { cursor: pointer; font-weight: 600; }
  .set { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  input { width: 64px; padding: 3px 6px; font: inherit; border: 1px solid var(--figma-color-border, #ccc); border-radius: 4px; background: transparent; color: inherit; user-select: text; }
  button { font: inherit; padding: 3px 9px; border-radius: 4px; border: 1px solid var(--figma-color-border, #ccc); background: transparent; color: inherit; cursor: pointer; }
  button:hover { background: var(--figma-color-bg-hover, rgba(128,128,128,.12)); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
    <rect x=".75" y=".75" width="30.5" height="30.5" rx="8" fill="#09090b" stroke="rgba(255,255,255,0.2)" stroke-width="1.2"/>
    <path d="M11 16h10M16 11v10" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <path d="M13 10l8 10-4.5-1.5-2.5 3.5-1.8-1 2.5-3.5-3.5-1z" fill="rgba(255,255,255,0.25)" stroke="#ffffff" stroke-width="1.2" stroke-linejoin="round"/>
  </svg>
  <div>
    <div class="title">Figma Canvas MCP</div>
    <div class="muted">Open Canvas Engine · Plugin API</div>
  </div>
  <span class="ver muted mono" id="ver"></span>
</header>

<section>
  <div class="state"><span class="dot" id="dot"></span><span id="state">Waiting for MCP server</span></div>
  <dl>
    <dt>Server</dt><dd class="mono" id="endpoint"></dd>
    <dt>File</dt><dd id="file">—</dd>
    <dt>Page</dt><dd id="page">—</dd>
    <dt>Selection</dt><dd id="sel">—</dd>
  </dl>
  <div class="help" id="help">
    Start your agent with <b>figma-canvas-mcp</b>; this window connects automatically.
    <code class="mono">npx -y figma-canvas-mcp</code>
  </div>
</section>

<section class="stats-wrap">
  <div class="stats">
    <div><b id="calls">0</b><span>calls</span></div>
    <div><b id="errors">0</b><span>errors</span></div>
    <div><b id="avg">–</b><span>avg ms</span></div>
  </div>
</section>

<section>
  <h2>Activity</h2>
  <div id="log"></div>
</section>

<details>
  <summary>Settings</summary>
  <div class="set">Port <input id="port" type="number" min="1024" max="65535" value="3055"><button id="apply">Reconnect</button></div>
  <div class="set"><button id="copy">Copy debug info</button><span class="muted" id="copied"></span></div>
</details>

<script>
"use strict";
// ════════════════════════════════════════════════════════════════════
//  Connection to the MCP server
// ════════════════════════════════════════════════════════════════════
var VERSION = "0.2.0";
var $ = function (id) { return document.getElementById(id); };
var ws = null, port = 3055, retry = null, nextMsg = 1;
var inflight = {};
var connected = false, info = null;
var stats = { calls: 0, errors: 0, ms: 0 };
var activity = [];

function clock() {
  var d = new Date();
  function p(n) { return n < 10 ? "0" + n : "" + n; }
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function render() {
  $("dot").className = "dot" + (connected ? " on" : "");
  $("state").textContent = connected ? "Connected" : "Waiting for MCP server";
  $("endpoint").textContent = "ws://localhost:" + port;
  $("help").hidden = connected;
  $("file").textContent = info ? info.fileName : "—";
  $("page").textContent = info ? info.pageName : "—";
  var sel = "—";
  if (info) {
    var s = info.selection || [];
    sel = !s.length ? "nothing selected" : s.length === 1 ? s[0].name + " · " + s[0].type.toLowerCase() : s.length + " layers";
  }
  $("sel").textContent = sel;
  $("calls").textContent = stats.calls;
  $("errors").textContent = stats.errors;
  $("avg").textContent = stats.calls ? Math.round(stats.ms / stats.calls) : "–";
  var html = activity.length ? "" : '<div class="empty muted">No calls yet.<br>Ask your agent to build or read something.</div>';
  activity.forEach(function (a) {
    html += '<div class="row mono' + (a.ok ? "" : " err") + '"><span class="muted">' + a.t + '</span><span class="m" title="' + esc(a.note) + '">' + esc(a.method) + (a.note ? ' <span class="muted">' + esc(a.note) + "</span>" : "") + '</span><span class="ms muted">' + a.ms + "</span></div>";
  });
  $("log").innerHTML = html;
}

function record(method, ms, ok, note) {
  stats.calls++; stats.ms += ms; if (!ok) stats.errors++;
  activity.unshift({ t: clock(), method: method, ms: ms, ok: ok, note: note || "" });
  if (activity.length > 40) activity.pop();
  render();
}

function noteFor(method, params, result, err) {
  if (err) return err.slice(0, 80);
  params = params || {};
  if (method === "render_html") return (result && result.nodes ? result.nodes + " nodes" : "") + (params.name ? " · " + params.name : "");
  if (method === "capture") return (params.frames || 30) + " frames";
  if (method === "prototype") return params.op + (params.trigger ? " " + params.trigger : "");
  if (method === "read") return params.target || "";
  if (method === "screenshot") return params.nodeId || "selection";
  if (method === "insert_asset") return params.kind || "";
  if (method === "export") return (params.format || "PNG") + (result && result.files ? " · " + result.files.length + " file(s)" : "");
  if (method === "motion" || method === "history" || method === "library" || method === "page") return params.op || "";
  if (method === "compare" && result) return Math.round(result.mismatch * 1000) / 10 + "% diff";
  if (method === "execute") return String(params.code || "").replace(/\s+/g, " ").slice(0, 40);
  return "";
}

var currentWsId = null; // id of the server request being handled, for progress forwarding

function toPlugin(method, params) {
  var id = nextMsg++;
  var wsId = currentWsId;
  return new Promise(function (resolve, reject) {
    inflight[id] = { resolve: resolve, reject: reject, wsId: wsId };
    parent.postMessage({ pluginMessage: { id: id, method: method, params: params } }, "*");
  });
}

function sendProgress(wsId, done, total, note) {
  if (wsId === null || wsId === undefined || !ws || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ id: wsId, progress: { done: done, total: total, note: note || "" } }));
}

function setInfo(i) {
  info = i;
  render();
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "hello", info: i }));
}

onmessage = function (e) {
  var m = e.data && e.data.pluginMessage;
  if (!m) return;
  if (m.type === "reply") {
    var f = inflight[m.id];
    if (!f) return;
    delete inflight[m.id];
    if (m.error) f.reject(new Error(m.error)); else f.resolve(m.result);
  } else if (m.type === "config") {
    port = m.port || 3055;
    $("port").value = port;
    render();
    connect();
  } else if (m.type === "info") {
    setInfo(m.info);
  } else if (m.type === "progress") {
    var pf = inflight[m.id];
    if (pf) sendProgress(pf.wsId, m.done, m.total, m.note);
  }
};

function b64(bytes) {
  var s = "", CH = 0x8000;
  for (var i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(s);
}

/** Replace every `bytes: Uint8Array` field in a result with `base64` so it survives JSON. */
function fixImages(result, depth) {
  depth = depth || 0;
  if (!result || typeof result !== "object" || depth > 6) return result;
  if (Array.isArray(result)) { result.forEach(function (x) { fixImages(x, depth + 1); }); return result; }
  if (result.bytes instanceof Uint8Array) { result.base64 = b64(result.bytes); delete result.bytes; }
  Object.keys(result).forEach(function (k) {
    var v = result[k];
    if (v && typeof v === "object" && !(v instanceof Uint8Array)) fixImages(v, depth + 1);
  });
  return result;
}

function connect() {
  clearTimeout(retry);
  if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
  try {
    ws = new WebSocket("ws://localhost:" + port);
  } catch (e) {
    retry = setTimeout(connect, 2000);
    return;
  }
  ws.onopen = async function () {
    connected = true;
    try { setInfo(await toPlugin("info", {})); } catch (e) { render(); }
  };
  ws.onclose = function () { connected = false; render(); retry = setTimeout(connect, 2000); };
  ws.onerror = function () {};
  ws.onmessage = function (ev) { handle(JSON.parse(ev.data)); };
}

async function handle(m) {
  var t0 = Date.now();
  currentWsId = m.id;
  try {
    var result;
    if (m.method === "render_html") result = await renderHtml(m.params);
    else if (m.method === "render_shader") result = await renderShader(m.params);
    else if (m.method === "insert_asset") result = await insertAsset(m.params);
    else if (m.method === "compare") result = await compareImages(m.params);
    else if (m.method === "ping") result = { pong: true, version: VERSION };
    else result = await toPlugin(m.method, m.params);
    fixImages(result);
    ws.send(JSON.stringify({ id: m.id, result: result }));
    record(m.method, Date.now() - t0, true, noteFor(m.method, m.params, result));
  } catch (e) {
    var msg = String((e && e.message) || e);
    record(m.method, Date.now() - t0, false, noteFor(m.method, m.params, null, msg));
    try { ws.send(JSON.stringify({ id: m.id, error: msg })); } catch (e2) {}
  }
}

$("ver").textContent = "v" + VERSION;
$("apply").onclick = function () {
  port = parseInt($("port").value, 10) || 3055;
  parent.postMessage({ pluginMessage: { type: "save_port", port: port } }, "*");
  render();
  connect();
};

$("copy").onclick = function () {
  var last = activity.filter(function (a) { return !a.ok; }).slice(0, 3).map(function (a) { return a.method + ": " + a.note; });
  var txt = ["figma-canvas-mcp v" + VERSION, "port " + port + " · " + (connected ? "connected" : "disconnected"),
    info ? "file: " + info.fileName + " · page: " + info.pageName : "no file info",
    "calls " + stats.calls + ", errors " + stats.errors, last.length ? "recent errors:\n" + last.join("\n") : "no recent errors"].join("\n");
  var ta = document.createElement("textarea");
  ta.value = txt; document.body.appendChild(ta); ta.select();
  var ok = false; try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove();
  $("copied").textContent = ok ? "Copied" : "Copy failed";
  setTimeout(function () { $("copied").textContent = ""; }, 1800);
};

render();

// ════════════════════════════════════════════════════════════════════
//  Assets / shaders
// ════════════════════════════════════════════════════════════════════
function bytesFromBase64(s) {
  var bin = atob(s), out = new Uint8Array(bin.length);
  for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

var MAX_IMAGE = 4096; // figma.createImage limit

/** Decode any browser-readable image to PNG bytes. Optional CSS `filter` is baked in; images larger than 4096 px are downscaled. */
async function blobToPng(blob, filter) {
  var url = URL.createObjectURL(blob);
  try {
    var img = new Image();
    img.src = url;
    await img.decode();
    var w = img.naturalWidth || 300, h = img.naturalHeight || 150;
    var k = Math.min(1, MAX_IMAGE / Math.max(w, h));
    var c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    var g = c.getContext("2d");
    if (filter) g.filter = filter;
    g.drawImage(img, 0, 0, c.width, c.height);
    var out = await new Promise(function (r) { c.toBlob(r, "image/png"); });
    return { bytes: new Uint8Array(await out.arrayBuffer()), width: c.width, height: c.height, naturalWidth: w, naturalHeight: h, downscaled: k < 1 };
  } finally { URL.revokeObjectURL(url); }
}

async function srcToPng(src, filter) {
  var res = await fetch(src);
  if (!res.ok) throw new Error("HTTP " + res.status);
  return blobToPng(await res.blob(), filter);
}

async function insertAsset(p) {
  if (p.kind === "svg") return toPlugin("insert_svg", p);
  if (p.kind === "image") {
    var png;
    try {
      png = await blobToPng(new Blob([bytesFromBase64(p.base64)]), p.filter);
    } catch (e) {
      throw new Error("Could not decode image (supported: png, jpg, gif, webp, svg, avif): " + e.message);
    }
    var warnings = png.downscaled ? ["image was " + png.naturalWidth + "×" + png.naturalHeight + ", downscaled to " + png.width + "×" + png.height + " (Figma limit 4096 px)"] : [];
    return toPlugin("place_image", { bytes: png.bytes, width: p.width || png.width, height: p.height || png.height, scaleMode: p.scaleMode, name: p.name, x: p.x, y: p.y, parentId: p.parentId, targetNodeId: p.targetNodeId, warnings: warnings });
  }
  if (p.kind === "video") {
    return toPlugin("place_video", { bytes: bytesFromBase64(p.base64), width: p.width, height: p.height, name: p.name, x: p.x, y: p.y, parentId: p.parentId, targetNodeId: p.targetNodeId });
  }
  throw new Error("Unknown asset kind " + p.kind);
}

// ════════════════════════════════════════════════════════════════════
//  Visual diff
// ════════════════════════════════════════════════════════════════════
async function loadSide(s) {
  var bytes;
  if (s.nodeId) {
    var shot = await toPlugin("screenshot", { nodeId: s.nodeId, scale: s.scale || 1 });
    bytes = shot.images[0].bytes;
  } else bytes = bytesFromBase64(s.base64);
  return createImageBitmap(new Blob([bytes]));
}

/** Pixel diff of two images (Figma nodes or PNG/JPG data). B is resized to A. */
async function compareImages(p) {
  var A = await loadSide(p.a), B = await loadSide(p.b);
  var W = A.width, H = A.height;
  function pixels(bm) {
    var c = document.createElement("canvas"); c.width = W; c.height = H;
    var g = c.getContext("2d", { willReadFrequently: true });
    g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
    g.drawImage(bm, 0, 0, W, H);
    return g.getImageData(0, 0, W, H);
  }
  var a = pixels(A), b = pixels(B);
  var thr = (p.threshold === undefined ? 0.1 : p.threshold) * 255;
  var out = new ImageData(W, H), bad = 0, sum = 0;
  var G = 8, cells = new Array(G * G).fill(0);
  var minX = W, minY = H, maxX = -1, maxY = -1;
  for (var y = 0; y < H; y++) {
    for (var x = 0; x < W; x++) {
      var i = (y * W + x) * 4;
      var d = Math.max(Math.abs(a.data[i] - b.data[i]), Math.abs(a.data[i + 1] - b.data[i + 1]), Math.abs(a.data[i + 2] - b.data[i + 2]));
      sum += d;
      var gray = (a.data[i] * 0.3 + a.data[i + 1] * 0.59 + a.data[i + 2] * 0.11) * 0.35 + 165;
      if (d > thr) {
        bad++;
        cells[Math.min(G - 1, Math.floor(y / H * G)) * G + Math.min(G - 1, Math.floor(x / W * G))]++;
        if (x < minX) minX = x; if (y < minY) minY = y; if (x > maxX) maxX = x; if (y > maxY) maxY = y;
        out.data[i] = 255; out.data[i + 1] = 40; out.data[i + 2] = 60;
      } else { out.data[i] = out.data[i + 1] = out.data[i + 2] = gray; }
      out.data[i + 3] = 255;
    }
  }
  var cellArea = (W / G) * (H / G);
  var hot = cells.map(function (n, idx) { return { row: Math.floor(idx / G), col: idx % G, mismatch: n / cellArea }; })
    .filter(function (c) { return c.mismatch > 0.01; }).sort(function (u, v) { return v.mismatch - u.mismatch; }).slice(0, 6)
    .map(function (c) { return { x: Math.round(c.col * W / G), y: Math.round(c.row * H / G), w: Math.round(W / G), h: Math.round(H / G), mismatch: Math.round(c.mismatch * 1000) / 1000 }; });
  var dc = document.createElement("canvas"); dc.width = W; dc.height = H;
  dc.getContext("2d").putImageData(out, 0, 0);
  var blob = await new Promise(function (r) { dc.toBlob(r, "image/png"); });
  return {
    width: W, height: H, sizeB: [B.width, B.height],
    aspectMismatch: Math.abs(W / H - B.width / B.height) > 0.02,
    mismatch: Math.round(bad / (W * H) * 10000) / 10000,
    meanDelta: Math.round(sum / (W * H) / 255 * 10000) / 10000,
    diffBox: maxX >= 0 ? { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 } : null,
    hotspots: hot,
    images: [{ name: "diff (red = different)", nodeId: "diff", width: W, height: H, bytes: new Uint8Array(await blob.arrayBuffer()) }],
  };
}

async function renderShader(p) {
  var c = document.createElement("canvas");
  c.width = p.width; c.height = p.height;
  var gl = c.getContext("webgl", { preserveDrawingBuffer: true, premultipliedAlpha: false });
  if (!gl) throw new Error("WebGL is not available in the plugin UI");
  function compile(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error("GLSL compile error: " + gl.getShaderInfoLog(s));
    return s;
  }
  var prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, "attribute vec2 p; void main(){ gl_Position = vec4(p,0.,1.); }"));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, p.fragment));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error("GLSL link error: " + gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  var buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  var ur = gl.getUniformLocation(prog, "u_resolution"); if (ur) gl.uniform2f(ur, p.width, p.height);
  var ut = gl.getUniformLocation(prog, "u_time"); if (ut) gl.uniform1f(ut, p.time || 0);
  gl.viewport(0, 0, p.width, p.height);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  var blob = await new Promise(function (r) { c.toBlob(r, "image/png"); });
  var bytes = new Uint8Array(await blob.arrayBuffer());
  return toPlugin("place_image", { bytes: bytes, width: p.width, height: p.height, name: p.name || "Shader", x: p.x, y: p.y, parentId: p.parentId, targetNodeId: p.targetNodeId });
}

// ════════════════════════════════════════════════════════════════════
//  HTML → Figma tree
// ════════════════════════════════════════════════════════════════════
var WARN = [];
function warn(s) { if (WARN.indexOf(s) < 0) WARN.push(s); }

var SKIP_TAGS = { SCRIPT: 1, STYLE: 1, LINK: 1, META: 1, TITLE: 1, HEAD: 1, NOSCRIPT: 1, TEMPLATE: 1, BR: 1 };
